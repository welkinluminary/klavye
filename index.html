  <style>
    /* Temel Sayfa ve Arka Plan Ayarları */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #060b19;
      color: #f1f5f9;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Canlı Aurora ve Işıltı Canvas Katmanı */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Final Konfeti Canvas Katmanı */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      pointer-events: none;
    }

    /* Glassmorphism Kart Stili */
    .glass-card {
      background: linear-gradient(145deg, rgba(12, 23, 51, 0.72), rgba(6, 11, 25, 0.84));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 229, 255, 0.18);
      box-shadow:
        0 18px 45px -12px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Etkileşimli Seçim Kartları */
    .choice-card {
      background: linear-gradient(155deg, rgba(15, 29, 64, 0.78), rgba(7, 14, 32, 0.88));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(0, 229, 255, 0.2);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.25s ease,
                  box-shadow 0.25s ease,
                  background 0.25s ease;
    }

    .choice-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 229, 255, 0.65);
      box-shadow: 0 14px 36px -10px rgba(0, 229, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .choice-card:active {
      transform: scale(0.985);
    }

    .choice-card.selected {
      background: linear-gradient(145deg, rgba(0, 229, 255, 0.2), rgba(20, 184, 166, 0.18));
      border-color: #00e5ff;
      box-shadow: 0 0 28px rgba(0, 229, 255, 0.35), inset 0 0 18px rgba(0, 229, 255, 0.12);
    }

    /* Parlayan Ana Buton */
    .btn-turq {
      background: linear-gradient(135deg, #00e5ff 0%, #14b8a6 100%);
      color: #04101f;
      box-shadow: 0 8px 28px -6px rgba(0, 229, 255, 0.55);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-turq:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 34px -4px rgba(0, 229, 255, 0.75);
      filter: brightness(1.06);
    }

    .btn-turq:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-turq:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* İkincil Buton */
    .btn-ghost {
      background: rgba(15, 29, 64, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #e2e8f0;
      transition: all 0.2s ease;
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(20, 40, 86, 0.85);
      border-color: rgba(0, 229, 255, 0.45);
      color: #ffffff;
    }

    .btn-ghost:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Ekran ve Soru Geçiş Animasyonları */
    @keyframes slideInRight {
      0% { opacity: 0; transform: translateX(26px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes slideInLeft {
      0% { opacity: 0; transform: translateX(-26px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(0, 229, 255, 0.35); }
      50% { box-shadow: 0 0 32px rgba(0, 229, 255, 0.7); }
    }

    .anim-slide-next {
      animation: slideInRight 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-slide-prev {
      animation: slideInLeft 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-fade-up {
      animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .pulse-glow {
      animation: pulseGlow 2.8s ease-in-out infinite;
    }

    /* Özel Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #060b19;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.3);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 229, 255, 0.55);
    }
  </style>
</head>

    /* =========================================================================
       3. UYGULAMA DURUMU (STATE) VE TURNUVA HESAPLAYICI
       ========================================================================= */
    const state = {
      screen: 'welcome',       // 'welcome' | 'stage1' | 'transition' | 'stage2' | 'result'
      navDir: 'next',          // 'next' | 'prev' (animasyon yönü)
      stage1Index: 0,          // 0..14 (15 eşleşme)
      stage1Choices: new Array(STAGE1_CRITERIA.length - 1).fill(null), // 'left' | 'right' | null
      stage2Index: 0,          // 0..29 (30 soru)
      stage2Answers: new Array(STAGE2_QUESTIONS.length).fill(null),    // 0 | 1 | 2 | null
      autoAdvanceTimer: null
    };

    /**
     * 1. Aşamadaki King of the Hill (Kazanan Kalır) eşleşmelerini
     * seçimler dizisine göre deterministik olarak hesaplar.
     */
    function computeStage1Bracket() {
      const matchups = [];
      let currentChampion = STAGE1_CRITERIA[0];

      for (let i = 0; i < STAGE1_CRITERIA.length - 1; i++) {
        const left = currentChampion;
        const right = STAGE1_CRITERIA[i + 1];
        const choice = state.stage1Choices[i];
        let winner = null;
        let loser = null;

        if (choice === 'left') {
          winner = left;
          loser = right;
        } else if (choice === 'right') {
          winner = right;
          loser = left;
        }

        matchups.push({ index: i, left, right, choice, winner, loser });

        if (winner) {
          currentChampion = winner;
        } else {
          // Henüz seçilmemiş adımdan sonrası hesaplanmaz
          break;
        }
      }

      return matchups;
    }

    /**
     * 1. Aşamadan en yüksek öncelikli ilk 3 kriteri döndürür.
     */
    function getStage1Top3() {
      const matchups = computeStage1Bracket();
      const stats = {};
      STAGE1_CRITERIA.forEach((c) => {
        stats[c.id] = { item: c, wins: 0, lastStep: -1, isChampion: false };
      });

      matchups.forEach((m) => {
        if (m.winner) {
          stats[m.winner.id].wins += 1;
          stats[m.winner.id].lastStep = m.index;
        }
      });

      const finalMatch = matchups[matchups.length - 1];
      if (finalMatch && finalMatch.winner) {
        stats[finalMatch.winner.id].isChampion = true;
      }

      return Object.values(stats)
        .filter((s) => s.wins > 0)
        .sort((a, b) => {
          if (a.isChampion !== b.isChampion) return a.isChampion ? -1 : 1;
          if (b.wins !== a.wins) return b.wins - a.wins;
          return b.lastStep - a.lastStep;
        })
        .slice(0, 3);
    }

    /**
     * Tüm testin final puanlarını, yüzdelerini ve kişiselleştirilmiş nedenlerini hesaplar.
     */
    function computeFinalResults() {
      const scores = { K: 0, M: 0, N: 0 };
      const matchups = computeStage1Bracket();
      const top3 = getStage1Top3();

      // 1. Aşama: Her galibiyetin kendi puanı
      matchups.forEach((m) => {
        if (m.winner) {
          scores.K += m.winner.weights.K;
          scores.M += m.winner.weights.M;
          scores.N += m.winner.weights.N;
        }
      });

      // 1. Aşama: İlk 3'e giren önceliklere ekstra ağırlık bonusu
      const bonusMultipliers = [2.5, 1.5, 1.0];
      top3.forEach((entry, idx) => {
        const mult = bonusMultipliers[idx] || 1;
        scores.K += entry.item.weights.K * mult;
        scores.M += entry.item.weights.M * mult;
        scores.N += entry.item.weights.N * mult;
      });

      // 2. Aşama: 30 senaryo sorusu (her biri +3 puan)
      const stage2PickedReasons = { K: [], M: [], N: [] };
      STAGE2_QUESTIONS.forEach((q, idx) => {
        const ansIdx = state.stage2Answers[idx];
        if (ansIdx !== null && q.options[ansIdx]) {
          const opt = q.options[ansIdx];
          scores[opt.target] += 3;
          stage2PickedReasons[opt.target].push({
            qId: q.id,
            reason: opt.reason
          });
        }
      });

      // Yüzdeleri hesapla (toplam 100 olacak şekilde)
      const total = scores.K + scores.M + scores.N || 1;
      const rawPct = {
        K: (scores.K / total) * 100,
        M: (scores.M / total) * 100,
        N: (scores.N / total) * 100
      };

      const ranked = ['K', 'M', 'N']
        .map((id) => ({
          id,
          score: scores[id],
          pct: Math.round(rawPct[id]),
          info: KEYBOARDS[id]
        }))
        .sort((a, b) => b.score - a.score);

      // Yuvarlama farkını 100'e eşitle
      const pctSum = ranked.reduce((acc, r) => acc + r.pct, 0);
      if (pctSum !== 100) {
        ranked[0].pct += 100 - pctSum;
      }

      const winner = ranked[0];
      const winnerId = winner.id;
      const winnerName = winner.info.name;

      // Kişiselleştirilmiş nedenler (1. Aşamadan 3 adet + 2. Aşamadan 3 adet)
      const stage1Reasons = [];
      const seenWinnerIds = new Set();

      // Kazanan klavyeyi doğrudan destekleyen ikili tercihleri bul
      const supportingMatchups = matchups
        .filter((m) => m.winner && m.loser && m.winner.weights[winnerId] > 0 && m.winner.weights[winnerId] >= m.loser.weights[winnerId])
        .reverse(); // Son turlardaki kritik seçimler öncelikli

      for (const m of supportingMatchups) {
        if (stage1Reasons.length >= 3) break;
        const pairKey = `${m.winner.id}_${m.loser.id}`;
        if (!seenWinnerIds.has(pairKey)) {
          seenWinnerIds.add(pairKey);
          stage1Reasons.push(
            `«${m.loser.title}» yerine «${m.winner.title}» seçeneğini tercih ettin; bu da doğrudan ${winnerName} karakterine uyuyor.`
          );
        }
      }

      // 2. Aşamadan en ayırt edici 3 senaryo nedenini seç
      const s2List = stage2PickedReasons[winnerId] || [];
      const stage2Reasons = [];
      if (s2List.length > 0) {
        const step = Math.max(1, Math.floor(s2List.length / 3));
        for (let i = 0; i < s2List.length && stage2Reasons.length < 3; i += step) {
          stage2Reasons.push(s2List[i].reason);
        }
      }

      return {
        ranked,
        winner,
        top3,
        reasons: [...stage1Reasons, ...stage2Reasons].slice(0, 6)
      };
    }

    /* =========================================================================
       5. CANLI NAVY-TURKUAZ AURORA VE IŞILTI ARKA PLAN ANIMASYONU (CANVAS)
       ========================================================================= */
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgWidth = 0;
    let bgHeight = 0;
    let sparkles = [];
    let bgTime = 0;

    function resizeCanvases() {
      bgWidth = bgCanvas.width = window.innerWidth;
      bgHeight = bgCanvas.height = window.innerHeight;

      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;

      // Ekran boyutuna göre parıltı parçacıkları oluştur
      const count = Math.min(85, Math.max(35, Math.floor((bgWidth * bgHeight) / 18000)));
      sparkles = Array.from({ length: count }, () => ({
        x: Math.random() * bgWidth,
        y: Math.random() * bgHeight,
        r: Math.random() * 2.1 + 0.6,
        vx: (Math.random() - 0.5) * 0.25,
        vy: -(Math.random() * 0.35 + 0.08),
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.025 + 0.01,
        hue: Math.random() > 0.35 ? 186 : 168 // Turkuaz ve camgöbeği tonları
      }));
    }

    function drawAuroraBackground() {
      bgTime += 0.008;

      // Derin Navy Blue baz gradyan
      const baseGrad = bgCtx.createLinearGradient(0, 0, bgWidth, bgHeight);
      baseGrad.addColorStop(0, '#040814');
      baseGrad.addColorStop(0.5, '#071126');
      baseGrad.addColorStop(1, '#0b1936');
      bgCtx.fillStyle = baseGrad;
      bgCtx.fillRect(0, 0, bgWidth, bgHeight);

      // Yumuşak hareketli turkuaz/lacivert aurora bulutları
      const orbs = [
        {
          x: bgWidth * (0.22 + 0.12 * Math.sin(bgTime * 0.7)),
          y: bgHeight * (0.25 + 0.1 * Math.cos(bgTime * 0.5)),
          r: Math.max(bgWidth, bgHeight) * 0.42,
          color: 'rgba(0, 229, 255, 0.13)'
        },
        {
          x: bgWidth * (0.78 + 0.11 * Math.cos(bgTime * 0.6)),
          y: bgHeight * (0.72 + 0.12 * Math.sin(bgTime * 0.45)),
          r: Math.max(bgWidth, bgHeight) * 0.45,
          color: 'rgba(20, 184, 166, 0.14)'
        },
        {
          x: bgWidth * (0.5 + 0.16 * Math.sin(bgTime * 0.4)),
          y: bgHeight * (0.5 + 0.14 * Math.cos(bgTime * 0.65)),
          r: Math.max(bgWidth, bgHeight) * 0.35,
          color: 'rgba(14, 165, 233, 0.09)'
        }
      ];

      bgCtx.save();
      bgCtx.globalCompositeOperation = 'screen';
      orbs.forEach((orb) => {
        const g = bgCtx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
        g.addColorStop(0, orb.color);
        g.addColorStop(1, 'rgba(6, 11, 25, 0)');
        bgCtx.fillStyle = g;
        bgCtx.beginPath();
        bgCtx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        bgCtx.fill();
      });

      // Akışkan ipeksi aurora dalga şeritleri
      for (let w = 0; w < 3; w++) {
        bgCtx.beginPath();
        const yBase = bgHeight * (0.3 + w * 0.22);
        for (let x = 0; x <= bgWidth; x += 24) {
          const y =
            yBase +
            Math.sin(x * 0.0032 + bgTime * (1.1 + w * 0.25) + w) * 42 +
            Math.cos(x * 0.0018 - bgTime * 0.8) * 26;
          if (x === 0) bgCtx.moveTo(x, y);
          else bgCtx.lineTo(x, y);
        }
        bgCtx.strokeStyle = w === 1 ? 'rgba(0, 229, 255, 0.09)' : 'rgba(20, 184, 166, 0.07)';
        bgCtx.lineWidth = 2 + w;
        bgCtx.stroke();
      }
      bgCtx.restore();

      // Süzülen ve parıldayan yıldız/ışık tanecikleri
      sparkles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.phase += p.speed;

        if (p.y < -10) {
          p.y = bgHeight + 10;
          p.x = Math.random() * bgWidth;
        }
        if (p.x < -10) p.x = bgWidth + 10;
        if (p.x > bgWidth + 10) p.x = -10;

        const alpha = 0.25 + 0.65 * (0.5 + 0.5 * Math.sin(p.phase));
        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        bgCtx.fillStyle = `hsla(${p.hue}, 100%, 75%, ${alpha})`;
        bgCtx.shadowBlur = 10;
        bgCtx.shadowColor = `hsla(${p.hue}, 100%, 60%, ${alpha})`;
        bgCtx.fill();
      });
      bgCtx.shadowBlur = 0;
    }

    /* =========================================================================
       6. FİNAL KUTLAMA KONFETİ VE PARILTI MOTORU
       ========================================================================= */
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiPieces = [];

    function triggerConfettiBurst() {
      const colors = ['#00e5ff', '#14b8a6', '#fbbf24', '#fde047', '#ffffff', '#38bdf8'];
      const count = 130;

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * Math.random());
        const speed = Math.random() * 9 + 4;
        confettiPieces.push({
          x: confettiCanvas.width * (0.2 + Math.random() * 0.6),
          y: confettiCanvas.height * (0.15 + Math.random() * 0.2),
          vx: Math.cos(angle) * speed * 0.85,
          vy: Math.sin(angle) * speed * 0.7 - 5,
          size: Math.random() * 7 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.22,
          life: 1,
          decay: Math.random() * 0.005 + 0.004,
          shape: Math.random() > 0.3 ? 'rect' : 'circle'
        });
      }
    }

    function drawConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      if (confettiPieces.length === 0) return;

      for (let i = confettiPieces.length - 1; i >= 0; i--) {
        const c = confettiPieces[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.18; // Yerçekimi
        c.vx *= 0.99; // Hava sürtünmesi
        c.rotation += c.vRot;
        c.life -= c.decay;

        if (c.life <= 0 || c.y > confettiCanvas.height + 30) {
          confettiPieces.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.globalAlpha = Math.max(0, c.life);
        confettiCtx.translate(c.x, c.y);
        confettiCtx.rotate(c.rotation);
        confettiCtx.fillStyle = c.color;

        if (c.shape === 'rect') {
          confettiCtx.fillRect(-c.size / 2, -c.size * 0.35, c.size, c.size * 0.7);
        } else {
          confettiCtx.beginPath();
          confettiCtx.arc(0, 0, c.size * 0.45, 0, Math.PI * 2);
          confettiCtx.fill();
        }
        confettiCtx.restore();
      }
    }

    /* =========================================================================
       7. ANA ANİMASYON DÖNGÜSÜ VE BAŞLATMA
       ========================================================================= */
    function animateLoop() {
      drawAuroraBackground();
      drawConfetti();
      requestAnimationFrame(animateLoop);
    }

    window.addEventListener('resize', resizeCanvases);

    window.onload = function () {
      resizeCanvases();
      render();
      animateLoop();
    };
  </script>
</body>
